[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "xpoints"
version = "0.2.0"
description = "Expected field-goal (xFG) and expected-points modelling for NBA shots"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5", "xgboost>=2.1",
    "lightgbm>=4.3", "catboost>=1.2", "optuna>=3.6", "shap>=0.45", "joblib>=1.4",
    "matplotlib>=3.8", "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
db = ["psycopg[binary]>=3.1"]

[project.scripts]
xpoints = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: reads large local data files (deselect with -m \"not slow\")",
    "requires_data: needs the local (git-ignored) data directory; skipped in CI",
]
filterwarnings = ["ignore::sklearn.exceptions.InconsistentVersionWarning"]
